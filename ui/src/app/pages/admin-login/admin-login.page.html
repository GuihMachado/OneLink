<main class="flex min-h-dvh items-center justify-center bg-slate-950 px-4 py-8 text-white">
    <form class="w-full max-w-sm space-y-5 rounded-2xl border border-white/10 bg-white/5 p-5 shadow-2xl backdrop-blur sm:p-7" (ngSubmit)="signIn()">
        <div>
            <a routerLink="/renata-martho" class="inline-flex min-h-11 items-center rounded-md border border-white/20 px-3 text-sm font-semibold text-white/80 transition hover:bg-white/10">← Voltar ao site</a>
            <h1 class="mt-3 text-3xl font-semibold">Admin</h1>
            <p class="mt-2 text-sm text-white/65">Entre para gerenciar clientes, links e imagens.</p>
        </div>

        @if (errorMessage) {
            <p class="rounded-md border border-red-400/40 bg-red-500/15 px-3 py-2 text-sm text-red-100">{{ errorMessage }}</p>
        }

        <label class="block space-y-2">
            <span class="text-sm font-medium text-white/80">E-mail</span>
            <input
                name="email"
                type="email"
                autocomplete="email"
                class="h-12 w-full rounded-md border border-white/15 bg-white px-3 text-base text-slate-950 outline-none focus:ring-2 focus:ring-white/60 sm:text-sm"
                [(ngModel)]="email">
        </label>

        <label class="block space-y-2">
            <span class="text-sm font-medium text-white/80">Senha</span>
            <input
                name="password"
                type="password"
                autocomplete="current-password"
                class="h-12 w-full rounded-md border border-white/15 bg-white px-3 text-base text-slate-950 outline-none focus:ring-2 focus:ring-white/60 sm:text-sm"
                [(ngModel)]="password">
        </label>

        <button
            type="submit"
            class="h-12 w-full rounded-md bg-white px-4 text-sm font-semibold text-slate-950 transition hover:bg-white/90 disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="loading">
            {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
    </form>
</main>
